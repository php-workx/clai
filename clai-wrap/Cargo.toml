[package]
name = "clai-wrap"
version = "0.1.0"
edition = "2021"
description = "PTY wrapper for clai terminal assistant"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
ringbuf = "0.4"
vte = "0.13"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
ratatui = "0.28"
crossterm = "0.28"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
signal-hook-registry = "1.4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_Security",
] }

[dependencies.tempfile]
version = "3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "ring_buffer"
harness = false

[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "picker"
harness = false

[features]
# Enable tests that require a real TTY (run manually with `cargo test --features tty_tests`)
tty_tests = []

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
# Allow common patterns
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
